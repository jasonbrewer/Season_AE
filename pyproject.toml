[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "footage-pipeline"
version = "0.1.0"
description = "Season Assistant Editor — macOS post-production tooling"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "xxhash==3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[project.scripts]
footage-pipeline-web = "footage_pipeline.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"footage_pipeline.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
